apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: todo-backend
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.backend.type }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
      name: http
  selector:
    app: todo-backend
    release: {{ .Release.Name }}
